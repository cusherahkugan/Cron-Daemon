name: cronDaemon Nightly Notes

on:
  schedule:
    - cron: "20 23 * * *"      # 23:20 UTC = 04:50 AM Sri Lanka (UTC+5:30); change as you like
  workflow_dispatch:
    inputs:
      day:
        description: "Force day number (optional, e.g. 1)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write               # lets the last step disable this workflow

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 120       # big tutorials have 100+ articles at 2-4 s each
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System libs for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu fonts-dejavu-extra

      - run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - uses: actions/cache@v4
        with:
          path: cache/links.json
          key: tutorial-links-${{ hashFiles('config/topics.yaml', 'src/scrape.py') }}-${{ github.run_id }}
          restore-keys: |
            tutorial-links-${{ hashFiles('config/topics.yaml', 'src/scrape.py') }}-

      - name: Generate and email today's tech stack
        id: gen
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          DAY: ${{ github.event.inputs.day }}
        run: |
          if [ -n "$DAY" ]; then
            python src/main.py --day "$DAY"
          else
            python src/main.py
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes
          path: output/*.pdf
          retention-days: 14

      - name: Disable workflow after the last topic
        if: steps.gen.outputs.finished == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable nightly.yml --repo "${{ github.repository }}"