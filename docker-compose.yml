services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # GPU (optional, NVIDIA): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8501:8501"
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: llama3.1:8b
      APP_PASSWORD: change-me
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data: